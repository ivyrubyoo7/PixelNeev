<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelNeev – Navbar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Navbar.css" />
  </head>
  <body>

    <!-- ░░ NAVBAR ░░ -->
    <header class="navbar" role="banner">
      <nav class="navbar__inner" aria-label="Main navigation">

        <!-- ── LEFT: Brand ── -->
        <a href="#home" class="navbar__brand" aria-label="PixelNeev home">
          <span class="navbar__brand-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="2" width="10" height="10" rx="2" fill="url(#g1)"/>
              <rect x="16" y="2" width="10" height="10" rx="2" fill="url(#g2)" opacity="0.6"/>
              <rect x="2" y="16" width="10" height="10" rx="2" fill="url(#g2)" opacity="0.6"/>
              <rect x="16" y="16" width="10" height="10" rx="2" fill="url(#g1)"/>
              <defs>
                <linearGradient id="g1" x1="2" y1="2" x2="12" y2="12" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#6366f1"/>
                  <stop offset="1" stop-color="#a855f7"/>
                </linearGradient>
                <linearGradient id="g2" x1="16" y1="2" x2="26" y2="12" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#818cf8"/>
                  <stop offset="1" stop-color="#c084fc"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="navbar__brand-name">PixelNeev</span>
        </a>

        <!-- ── CENTER: Nav Links ── -->
        <ul class="navbar__links" role="list" id="navLinks">
          <li>
            <a href="#home"     class="navbar__link" data-page="home"     aria-current="page">
              <span class="navbar__link-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              </span>
              Home
            </a>
          </li>
          <li>
            <a href="#explore"  class="navbar__link" data-page="explore">
              <span class="navbar__link-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              Explore
            </a>
          </li>
          <li>
            <a href="#projects" class="navbar__link" data-page="projects">
              <span class="navbar__link-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              </span>
              Projects
            </a>
          </li>
          <li>
            <a href="#profile"  class="navbar__link" data-page="profile">
              <span class="navbar__link-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              Profile
            </a>
          </li>
        </ul>

        <!-- ── RIGHT: Controls ── -->
        <div class="navbar__controls">

          <!-- Theme toggle -->
          <button
            class="navbar__theme-btn"
            id="themeToggle"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            <span class="navbar__theme-icon navbar__theme-icon--dark" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </span>
            <span class="navbar__theme-icon navbar__theme-icon--light" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </span>
          </button>

          <!-- Avatar -->
          <button
            class="navbar__avatar"
            id="avatarBtn"
            aria-label="Go to profile"
            title="Profile"
            data-page="profile"
          >
            <span class="navbar__avatar-letter" id="avatarLetter">U</span>
            <span class="navbar__avatar-ring" aria-hidden="true"></span>
          </button>

          <!-- Hamburger (mobile) -->
          <button
            class="navbar__hamburger"
            id="hamburgerBtn"
            aria-label="Toggle mobile menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
          >
            <span class="navbar__hamburger-line"></span>
            <span class="navbar__hamburger-line"></span>
            <span class="navbar__hamburger-line"></span>
          </button>
        </div>
      </nav>

      <!-- ── MOBILE DROPDOWN ── -->
      <div class="navbar__mobile-menu" id="mobileMenu" role="navigation" aria-label="Mobile navigation" aria-hidden="true">
        <ul class="navbar__mobile-links" role="list">
          <li>
            <a href="#home"     class="navbar__mobile-link" data-page="home">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Home
            </a>
          </li>
          <li>
            <a href="#explore"  class="navbar__mobile-link" data-page="explore">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Explore
            </a>
          </li>
          <li>
            <a href="#projects" class="navbar__mobile-link" data-page="projects">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              Projects
            </a>
          </li>
          <li>
            <a href="#profile"  class="navbar__mobile-link" data-page="profile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Profile
            </a>
          </li>
        </ul>
      </div>
    </header>

    <!-- Demo page content to show active state -->
    <main class="demo-content">
      <p class="demo-hint">Click nav links to see active state · Toggle theme · Resize to see mobile menu</p>
    </main>

    <script src="Navbar.js"></script>
  </body>
</html>
