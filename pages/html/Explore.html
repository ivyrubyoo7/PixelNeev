<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelNeev – Explore Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../navbar/Navbar.css" />
    <link rel="stylesheet" href="../css/Main.css" /> <link rel="stylesheet" href="../css/Explore.css" />
  </head>
  <body>

    <div id="navbar-container"></div>

    <main class="explore-layout" role="main">
      
      <header class="explore-filters">
        <div class="explore-filters__inner">
          
          <div class="filter-group">
            <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            <select class="filter-select" aria-label="Filter by Category">
              <option value="all">All Categories</option>
              <option value="software">Software</option>
              <option value="hardware">Hardware</option>
            </select>
          </div>

          <div class="filter-group filter-group--searchable" id="techDropdown">
            <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <input type="text" class="filter-input" id="techSearchInput" placeholder="Type a tech stack (e.g., React)..." autocomplete="off" />
            
            <ul class="tech-options-list" id="techOptionsList">
              </ul>
          </div>

        </div>
      </header>

      <section class="masonry-grid" id="masonryGrid">
        </section>

    </main>

    <script src="../../navbar/Navbar.js"></script>
    <script src="../js/Explore.js"></script>
  </body>
</html>
